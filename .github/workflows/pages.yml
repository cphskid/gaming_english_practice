# 把遊戲發佈到 GitHub Pages。
#
# 為什麼需要這個：Artifact 是跑在沙箱裡的，連不出去到 Supabase，
# 所以在 Artifact 上永遠註冊不了帳號。要接資料庫就得有一個真的網址，
# 小朋友也才有一個可以加書籤的連結。
name: pages

on:
  push:
    branches: [claude/project-thread-BetaRun]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 禁散布的圖放在私有 repo，用只能讀那個 repo 的金鑰拉下來，見 tools/private-assets.sh
      - uses: actions/checkout@v4
        with:
          repository: cphskid/gaming_english_assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: private-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: sh tools/private-assets.sh private-assets
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
