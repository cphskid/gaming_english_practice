<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>單字守塔</title>
<style>
  :root{
    --bg:#2d4a2b; --ink:#f3ecd8; --muted:#a8b89a;
    --panel:#3d2f24; --panel2:#4f3d2e; --line:#6b533d;
    --gold:#f2b229; --blood:#c9453d; --sky:#4a7fd4; --leaf:#6fbf4a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden; user-select:none;
  }
  #app{width:100%;max-width:520px;height:100%;max-height:940px;display:flex;flex-direction:column;padding:10px;gap:8px}

  .panel{background:var(--panel);border:3px solid var(--line);border-radius:14px}

  /* ---- HUD ---- */
  #hud{display:flex;align-items:center;gap:8px;padding:8px 10px;font-weight:700;font-size:14px}
  #hud .sep{margin-left:auto}
  .tag{display:flex;align-items:center;gap:4px}
  #hp{color:var(--blood)} #coin{color:var(--gold)}

  /* ---- 題目 ---- */
  #quiz{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:66px}
  #qemoji{font-size:34px;line-height:1}
  #qzh{font-size:23px;font-weight:800;line-height:1.15}
  #qhint{font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
  #say{border:none;background:var(--sky);color:#fff;border-radius:10px;width:42px;height:42px;font-size:19px;cursor:pointer;flex:none;margin-left:auto}
  #say:disabled{opacity:.35}

  /* ---- 戰場 ---- */
  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
  canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;border-radius:12px;touch-action:manipulation}

  /* ---- 底部 ---- */
  #tray{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
  #trayTitle{font-size:13px;color:var(--muted);font-weight:700}
  .shop{display:flex;gap:8px}
  .card{
    flex:1;background:var(--panel2);border:2px solid var(--line);border-radius:10px;
    padding:8px;cursor:pointer;text-align:left;color:inherit;font-family:inherit;
  }
  .card:disabled{opacity:.4;cursor:default}
  .card.sel{border-color:var(--gold);background:#5d4832}
  .card b{display:block;font-size:14px}
  .card span{font-size:11px;color:var(--muted);display:block;margin-top:2px;line-height:1.3}
  .card i{font-style:normal;color:var(--gold);font-weight:700;font-size:12px}
  .btn{
    border:none;border-radius:12px;padding:13px;font-size:17px;font-weight:800;
    color:#fff;background:var(--leaf);cursor:pointer;font-family:inherit;width:100%;
    box-shadow:0 3px 0 #4c8a33;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4c8a33}
  .btn.ghost{background:var(--panel2);box-shadow:0 3px 0 #2e241b;color:var(--ink)}

  /* ---- 覆蓋層 ---- */
  #over{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;background:rgba(20,30,18,.93);border-radius:12px;text-align:center;padding:20px;z-index:5;
  }
  #over.on{display:flex}
  #over h2{margin:0;font-size:27px}
  #over p{margin:0;font-size:14px;color:var(--muted);line-height:1.7;max-width:340px}
  #toast{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    background:rgba(20,30,18,.9);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;
    opacity:0;transition:.25s;pointer-events:none;z-index:4;white-space:nowrap;
  }
  #toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">

  <div id="hud" class="panel">
    <span class="tag" id="hp">❤️ 20</span>
    <span class="tag" id="coin">🪙 80</span>
    <span class="sep"></span>
    <span class="tag" id="wave">第 1 波</span>
  </div>

  <div id="quiz" class="panel">
    <div id="qemoji">🛡️</div>
    <div>
      <div id="qzh">準備防守</div>
      <div id="qhint">蓋好塔之後按下面的按鈕開戰</div>
    </div>
    <button id="say" disabled>🔊</button>
  </div>

  <div id="stage">
    <canvas id="cv" width="480" height="620"></canvas>
    <div id="toast"></div>
    <div id="over">
      <h2 id="overTitle">守住了</h2>
      <p id="overText"></p>
      <button class="btn" id="overBtn">再玩一次</button>
    </div>
  </div>

  <div id="tray" class="panel">
    <div id="trayTitle">備戰：點空地蓋塔</div>
    <div class="shop">
      <button class="card sel" id="buyArchery" data-kind="archery">
        <b>🏹 箭塔 <i>40</i></b>
        <span>射程內的敵人會被它射中，傷害高</span>
      </button>
      <button class="card" id="buyBarracks" data-kind="barracks">
        <b>🛡️ 軍營 <i>30</i></b>
        <span>派士兵擋在路上，怪會停下來打士兵</span>
      </button>
    </div>
    <button class="btn" id="go">開始第 1 波</button>
  </div>

</div>

<script src="../../data/core300.js"></script>
<script src="./art.js"></script>
<script>
(function(){
  "use strict";

  var WORDS = (window.CORE300 && window.CORE300.words) || [];
  var ART = window.TD_ART || {};
  if (!WORDS.length) {
    document.getElementById('qzh').textContent = '題庫載入失敗';
    return;
  }

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var $ = function(id){ return document.getElementById(id); };

  // ---------- 圖片 ----------
  var img = {};
  Object.keys(ART).forEach(function(k){ var i = new Image(); i.src = ART[k]; img[k] = i; });

  // ---------- 地圖 ----------
  // 兩條路都從左邊進來，繞一段之後匯合到右邊的城堡
  var PATHS = [
    [{x:6,y:120},{x:150,y:120},{x:150,y:255},{x:355,y:255},{x:392,y:295}],
    [{x:6,y:525},{x:120,y:525},{x:120,y:395},{x:355,y:395},{x:392,y:325}]
  ];
  var CASTLE = {x:414, y:310};

  // 蓋塔的位置固定，小螢幕上比自由擺放好操作
  var SLOTS = [
    {x:86,  y:195}, {x:218, y:160}, {x:318, y:168},
    {x:78,  y:455}, {x:205, y:492}, {x:318, y:496},
    {x:247, y:325}   // 正中央這格兩條路都打得到
  ];

  var TOWERS = {
    archery:  { name:'箭塔', cost:40, range:108, damage:14 },
    barracks: { name:'軍營', cost:30, range:0,   damage:0, blockRadius:26, soldierHp:60 }
  };

  // ---------- 路徑工具 ----------
  function pathLength(pts){
    var L = 0;
    for (var i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    return L;
  }
  function pointAt(pts, dist){
    for (var i = 1; i < pts.length; i++) {
      var seg = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
      if (dist <= seg) {
        var t = seg ? dist/seg : 0;
        return { x: pts[i-1].x + (pts[i].x-pts[i-1].x)*t, y: pts[i-1].y + (pts[i].y-pts[i-1].y)*t };
      }
      dist -= seg;
    }
    return pts[pts.length-1];
  }
  var PATH_LEN = PATHS.map(pathLength);

  // ---------- 狀態 ----------
  var S;
  function reset(){
    S = {
      phase:'build', wave:1, hp:20, coins:80,
      towers:[],              // {slot, kind, soldier}
      enemies:[], shots:[], pops:[],
      target:null,            // 目前這題要打的敵人
      combo:0, correct:0, asked:0,
      spawnQueue:[], spawnTimer:0, spawnCount:0,
      picked:'archery', over:false, t:0
    };
  }

  function shuffle(a){
    a = a.slice();
    for (var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  // ---------- 波次 ----------
  // 每波的敵人數與血量都往上加，塔蓋得不夠就會開始漏怪
  function waveSpec(n){
    return { count: 3 + n, hp: 18 + (n-1)*10, speed: 15 + (n-1)*1.4 };
  }

  function startWave(){
    if (S.phase !== 'build') return;
    var spec = waveSpec(S.wave);
    var lvl = S.wave <= 2 ? 1 : (S.wave <= 4 ? 2 : 3);
    var pool = shuffle(WORDS.filter(function(w){ return w.level <= lvl; }));

    S.spawnQueue = [];
    for (var i = 0; i < spec.count; i++) {
      S.spawnQueue.push({
        word: pool[i % pool.length],
        path: i % 2,
        hp: spec.hp, speed: spec.speed,
        art: i % 2 ? 'goblinPurple' : 'goblinRed'
      });
    }
    S.spawnTimer = 0;
    S.phase = 'battle';
    syncUI();
  }

  function spawnNext(){
    var e = S.spawnQueue.shift();
    if (!e) return;
    S.enemies.push({
      word:e.word, path:e.path, dist:0, hp:e.hp, maxHp:e.hp,
      speed:e.speed, art:e.art, frame:Math.random()*7, flash:0, blocked:false,
      lift:(S.spawnCount++ % 2) * 22
    });
    if (!S.target) pickQuestion();
  }

  // 題目一定從「場上還活著的敵人」裡選，所以永遠有答案可以點
  function pickQuestion(){
    if (!S.enemies.length) { S.target = null; return syncQuiz(); }
    S.target = S.enemies[(Math.random()*S.enemies.length)|0];
    S.asked++;
    syncQuiz();
  }

  function speak(t){
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.85;
      speechSynthesis.speak(u);
    } catch(e){}
  }

  function toast(msg){
    var el = $('toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 1100);
  }

  // ---------- 作答 ----------
  function tapEnemy(e){
    if (S.phase !== 'battle' || !S.target) return;

    if (e === S.target) {
      S.correct++; S.combo++;
      var gain = 5 + Math.min(5, Math.floor(S.combo/3) * 2);
      S.coins += gain;
      volley(e);
      S.pops.push({ x:e._x, y:e._y-40, text:'+'+gain+' 🪙', color:'#f2b229', life:1 });
      speak(e.word.word);
    } else {
      S.combo = 0;
      e.flash = .45;                       // 點錯的那隻閃一下紅
      S.pops.push({ x:e._x, y:e._y-30, text:'✗', color:'#ffb4b0', life:.8 });
      pickQuestion();                      // 塔不開火，直接換下一題
    }
    syncUI();
  }

  // 齊射：射程涵蓋到這隻敵人的塔全部打它一次
  function volley(e){
    var total = 0;
    S.towers.forEach(function(t){
      var spec = TOWERS[t.kind];
      if (!spec.damage) return;
      var s = SLOTS[t.slot];
      if (Math.hypot(s.x-e._x, s.y-e._y) > spec.range) return;
      total += spec.damage;
      S.shots.push({ x0:s.x, y0:s.y-18, x1:e._x, y1:e._y-14, life:.22 });
    });

    if (!total) {
      S.pops.push({ x:e._x, y:e._y-24, text:'沒有塔打得到', color:'#ffd9a0', life:1.1 });
      pickQuestion();
      return;
    }

    e.hp -= total;
    S.pops.push({ x:e._x+14, y:e._y-24, text:'-'+total, color:'#fff', life:.9 });
    if (e.hp <= 0) killEnemy(e);
    pickQuestion();
  }

  function killEnemy(e){
    var i = S.enemies.indexOf(e);
    if (i >= 0) S.enemies.splice(i, 1);
    if (S.target === e) S.target = null;
  }

  // ---------- 蓋塔 ----------
  function tapSlot(idx){
    if (S.phase !== 'build') return;
    if (S.towers.some(function(t){ return t.slot === idx; })) return toast('這格已經有建築了');

    var kind = S.picked, spec = TOWERS[kind];
    if (S.coins < spec.cost) return toast('銅幣不夠，還差 ' + (spec.cost - S.coins) + ' 枚');

    S.coins -= spec.cost;
    var t = { slot:idx, kind:kind, soldier:null };
    if (kind === 'barracks') t.soldier = makeSoldier(idx);
    S.towers.push(t);
    syncUI();
  }

  // 軍營的士兵站到最近的路徑點上擋路
  function makeSoldier(slotIdx){
    var s = SLOTS[slotIdx], best = null;
    PATHS.forEach(function(pts, pi){
      for (var d = 0; d < PATH_LEN[pi]; d += 6) {
        var p = pointAt(pts, d), dd = Math.hypot(p.x-s.x, p.y-s.y);
        if (!best || dd < best.d) best = { d:dd, x:p.x, y:p.y, path:pi, dist:d };
      }
    });
    return { x:best.x, y:best.y, path:best.path, dist:best.dist, hp:TOWERS.barracks.soldierHp, respawn:0 };
  }

  // ---------- 每幀更新 ----------
  function update(dt){
    S.t += dt;

    if (S.phase === 'battle') {
      S.spawnTimer -= dt;
      if (S.spawnQueue.length && S.spawnTimer <= 0) { spawnNext(); S.spawnTimer = 2.4; }

      var soldiers = S.towers.filter(function(t){ return t.soldier && t.soldier.hp > 0; })
                             .map(function(t){ return t.soldier; });

      S.enemies.forEach(function(e){
        e.frame = (e.frame + dt*7) % 7;
        if (e.flash > 0) e.flash -= dt;

        // 前面有活著的士兵就停下來打它
        var blocker = null;
        soldiers.forEach(function(sd){
          if (sd.path !== e.path) return;
          var gap = sd.dist - e.dist;
          if (gap >= -4 && gap < TOWERS.barracks.blockRadius) blocker = sd;
        });
        e.blocked = !!blocker;

        if (blocker) {
          blocker.hp -= dt * 9;
        } else {
          e.dist += e.speed * dt;
        }

        var p = pointAt(PATHS[e.path], e.dist);
        e._x = p.x; e._y = p.y;

        if (e.dist >= PATH_LEN[e.path]) {      // 走到城堡
          S.hp--;
          S.pops.push({ x:CASTLE.x-20, y:CASTLE.y-40, text:'-1 ❤️', color:'#ff9a94', life:1.1 });
          killEnemy(e);
          syncUI();
        }
      });

      // 士兵死了過一陣子再補一個
      S.towers.forEach(function(t){
        if (t.kind !== 'barracks' || !t.soldier) return;
        if (t.soldier.hp <= 0) {
          t.soldier.respawn += dt;
          if (t.soldier.respawn > 6) t.soldier = makeSoldier(t.slot);
        }
      });

      if (!S.target && S.enemies.length) pickQuestion();

      if (S.hp <= 0) return finish(false);
      if (!S.spawnQueue.length && !S.enemies.length) {
        if (S.wave >= 5) return finish(true);
        S.wave++; S.phase = 'build'; S.target = null; syncUI(); syncQuiz();
      }
    }

    S.shots = S.shots.filter(function(s){ s.life -= dt; return s.life > 0; });
    S.pops = S.pops.filter(function(p){ p.life -= dt; p.y -= dt*22; return p.life > 0; });
  }

  // ---------- 畫面 ----------
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function draw(){
    // 草地
    ctx.fillStyle = '#6ea84f'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    for (var i=0;i<W;i+=48) for (var j=(i/48%2)*24;j<H;j+=48) ctx.fillRect(i,j,24,24);

    // 路
    PATHS.forEach(function(pts){
      ctx.strokeStyle = '#a8814f'; ctx.lineWidth = 30; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for (var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      ctx.strokeStyle = '#c29a63'; ctx.lineWidth = 22; ctx.stroke();
    });

    // 城堡
    if (img.castle && img.castle.complete)
      ctx.drawImage(img.castle, CASTLE.x-64, CASTLE.y-66, 128, 102);

    // 蓋塔的格子
    SLOTS.forEach(function(s, i){
      var t = S.towers.find(function(x){ return x.slot === i; });
      if (!t) {
        if (S.phase === 'build') {
          ctx.fillStyle = 'rgba(255,255,255,.22)';
          ctx.beginPath(); ctx.arc(s.x, s.y, 17, 0, 7); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.75)';
          ctx.font = 'bold 22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('+', s.x, s.y+1);
        }
        return;
      }
      // 備戰時把射程畫出來，才看得懂擺在哪裡有用
      var spec = TOWERS[t.kind];
      if (S.phase === 'build' && spec.range) {
        ctx.fillStyle = 'rgba(255,255,255,.10)';
        ctx.beginPath(); ctx.arc(s.x, s.y, spec.range, 0, 7); ctx.fill();
      }
      var im = img[t.kind];
      if (im && im.complete) ctx.drawImage(im, s.x-48, s.y-58, 96, 128);
    });

    // 士兵
    S.towers.forEach(function(t){
      var sd = t.soldier;
      if (!sd || sd.hp <= 0) return;
      if (img.warrior && img.warrior.complete) ctx.drawImage(img.warrior, sd.x-32, sd.y-46, 64, 64);
      bar(sd.x-17, sd.y-50, 34, 4, sd.hp/TOWERS.barracks.soldierHp, '#6fbf4a');
    });

    // 敵人
    S.enemies.forEach(function(e){
      var im = img[e.art];
      if (im && im.complete) {
        if (e.flash > 0) { ctx.save(); ctx.globalAlpha = .55; }
        ctx.drawImage(im, ((e.frame|0)%7)*64, 0, 64, 64, e._x-28, e._y-42, 56, 56);
        if (e.flash > 0) {
          ctx.globalCompositeOperation='source-atop';
          ctx.fillStyle='rgba(220,60,50,.8)'; ctx.fillRect(e._x-28, e._y-42, 56, 56);
          ctx.restore();
        }
      }
      bar(e._x-19, e._y-48, 38, 4, e.hp/e.maxHp, '#d4504a');

      // 頭上的單字
      var label = e.word.word;
      ctx.font = 'bold 15px system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      var w = ctx.measureText(label).width + 14;
      var lx = Math.max(3, Math.min(W - w - 3, e._x - w/2));   // 夾在畫布內，邊緣的怪也讀得到字
      var isTarget = (e === S.target);
      ctx.fillStyle = isTarget ? 'rgba(30,26,18,.9)' : 'rgba(30,26,18,.72)';
      roundRect(lx, e._y-72-e.lift, w, 21, 7); ctx.fill();
      if (isTarget) { ctx.strokeStyle = '#f2b229'; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.fillStyle = '#fff'; ctx.fillText(label, lx + w/2, e._y-61-e.lift);

      if (e.blocked) {
        ctx.font = '13px sans-serif'; ctx.fillStyle='#ffe08a';
        ctx.fillText('⚔️', e._x+24, e._y-44);
      }
    });

    // 箭
    S.shots.forEach(function(s){
      ctx.strokeStyle = 'rgba(255,240,190,' + (s.life/0.22) + ')';
      ctx.lineWidth = 3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(s.x0,s.y0); ctx.lineTo(s.x1,s.y1); ctx.stroke();
    });

    // 飄字
    S.pops.forEach(function(p){
      ctx.globalAlpha = Math.min(1, p.life);
      ctx.font = 'bold 16px system-ui, sans-serif'; ctx.textAlign='center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    });
  }

  function bar(x,y,w,h,pct,color){
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x-1,y-1,w+2,h+2);
    ctx.fillStyle = color; ctx.fillRect(x, y, Math.max(0, w*pct), h);
  }

  // ---------- UI ----------
  function syncUI(){
    $('hp').textContent = '❤️ ' + Math.max(0, S.hp);
    $('coin').textContent = '🪙 ' + S.coins;
    $('wave').textContent = '第 ' + S.wave + ' 波';

    var build = (S.phase === 'build');
    $('trayTitle').textContent = build
      ? '備戰：點空地蓋塔'
      : '戰鬥中：點出正確的那隻怪';
    $('go').hidden = !build;
    $('go').textContent = '開始第 ' + S.wave + ' 波';
    $('buyArchery').disabled = !build;
    $('buyBarracks').disabled = !build;
    $('say').disabled = !S.target;
  }

  function syncQuiz(){
    if (S.target) {
      $('qemoji').textContent = S.target.word.emoji;
      $('qzh').textContent = S.target.word.zh;
      $('qhint').textContent = S.target.word.pos + '　點出頭上寫著這個字的怪';
    } else if (S.phase === 'build') {
      $('qemoji').textContent = '🛡️';
      $('qzh').textContent = '準備防守';
      $('qhint').textContent = '蓋好塔之後按下面的按鈕開戰';
    }
    $('say').disabled = !S.target;
  }

  function finish(win){
    S.phase = 'done'; S.over = true;
    $('overTitle').textContent = win ? '🎉 守住了！' : '城堡被攻破了';
    var acc = S.asked ? Math.round(S.correct / S.asked * 100) : 0;
    $('overText').textContent = win
      ? '五波全部擋下來了。答對 ' + S.correct + ' 題，正確率 ' + acc + '%。'
      : '撐到第 ' + S.wave + ' 波。答對 ' + S.correct + ' 題，正確率 ' + acc + '%。塔蓋得多一點，或用軍營把怪擋久一些。';
    $('over').classList.add('on');
  }

  // ---------- 輸入 ----------
  cv.addEventListener('pointerdown', function(ev){
    if (S.over) return;
    var r = cv.getBoundingClientRect();
    // canvas 用 object-fit: contain，要換算回邏輯座標
    var scale = Math.min(r.width/W, r.height/H);
    var ox = (r.width - W*scale)/2, oy = (r.height - H*scale)/2;
    var x = (ev.clientX - r.left - ox)/scale, y = (ev.clientY - r.top - oy)/scale;

    if (S.phase === 'battle') {
      var hit = null, best = 34;
      S.enemies.forEach(function(e){
        var d = Math.hypot(e._x - x, (e._y-30) - y);
        if (d < best) { best = d; hit = e; }
      });
      if (hit) tapEnemy(hit);
      return;
    }
    if (S.phase === 'build') {
      for (var i = 0; i < SLOTS.length; i++) {
        if (Math.hypot(SLOTS[i].x - x, SLOTS[i].y - y) < 30) return tapSlot(i);
      }
    }
  });

  document.querySelectorAll('.card').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.card').forEach(function(b){ b.classList.remove('sel'); });
      btn.classList.add('sel');
      S.picked = btn.dataset.kind;
    });
  });

  $('go').addEventListener('click', function(){
    if (!S.towers.length) return toast('先蓋一座塔再開戰');
    startWave();
  });
  $('say').addEventListener('click', function(){ if (S.target) speak(S.target.word.word); });
  $('overBtn').addEventListener('click', function(){
    $('over').classList.remove('on'); reset(); syncUI(); syncQuiz();
  });

  // ---------- 主迴圈 ----------
  var last = performance.now();
  function loop(now){
    var dt = Math.min(.05, (now - last)/1000); last = now;
    if (!S.over) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  reset(); syncUI(); syncQuiz();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
