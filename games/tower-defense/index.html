<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>單字守塔</title>
<style>
  :root{
    --sea:#2a5b8f; --ink:#f3ecd8; --muted:#a8b89a;
    --panel:#3d2f24; --panel2:#4f3d2e; --line:#6b533d;
    --gold:#f2b229; --blood:#c9453d; --sky:#4a7fd4; --leaf:#6fbf4a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--sea); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden; user-select:none;
  }
  #app{width:100%;height:100%;display:flex;flex-direction:column;padding:6px;gap:6px}

  .panel{background:var(--panel);border:3px solid var(--line);border-radius:12px}

  /* ---- 橫向只留一條 HUD，其餘高度全給地圖 ---- */
  #hud{display:flex;align-items:center;gap:10px;padding:5px 10px;flex:none}
  #hud .stat{font-weight:800;font-size:15px;white-space:nowrap}
  #hp{color:var(--blood)} #coin{color:var(--gold)}
  #wave{color:var(--muted);font-size:13px}

  #quiz{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;min-width:0}
  #qemoji{font-size:26px;line-height:1;flex:none}
  #qzh{font-size:21px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #qhint{font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
  #say{border:none;background:var(--sky);color:#fff;border-radius:9px;width:38px;height:34px;font-size:17px;cursor:pointer;flex:none}
  #say:disabled{opacity:.35}

  /* ---- 戰場 ---- */
  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
  canvas{max-width:100%;max-height:100%;image-rendering:pixelated;border-radius:10px;touch-action:manipulation;display:block}

  /* ---- 商店只在備戰時蓋在地圖下緣，戰鬥時整個收起來 ---- */
  #tray{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    display:flex;align-items:stretch;gap:8px;padding:7px;z-index:3;max-width:96%;
  }
  #tray[hidden]{display:none}
  .card{
    background:var(--panel2);border:2px solid var(--line);border-radius:9px;
    padding:6px 9px;cursor:pointer;text-align:left;color:inherit;font-family:inherit;white-space:nowrap;
  }
  .card.sel{border-color:var(--gold);background:#5d4832}
  .card b{display:block;font-size:14px}
  .card span{font-size:11px;color:var(--muted);display:block;margin-top:1px}
  .card i{font-style:normal;color:var(--gold);font-weight:700}
  .btn{
    border:none;border-radius:10px;padding:8px 18px;font-size:16px;font-weight:800;
    color:#fff;background:var(--leaf);cursor:pointer;font-family:inherit;
    box-shadow:0 3px 0 #4c8a33;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4c8a33}

  /* ---- 覆蓋層 ---- */
  #over{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;background:rgba(18,28,16,.94);border-radius:10px;text-align:center;padding:20px;z-index:5;
  }
  #over.on{display:flex}
  #over h2{margin:0;font-size:26px}
  #over p{margin:0;font-size:14px;color:var(--muted);line-height:1.7;max-width:420px}
  #toast{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    background:rgba(18,28,16,.92);padding:6px 15px;border-radius:99px;font-size:13px;font-weight:700;
    opacity:0;transition:.25s;pointer-events:none;z-index:4;white-space:nowrap;
  }
  #toast.on{opacity:1}

  @media (prefers-reduced-motion: reduce){
    .btn:active{transform:none}
    #toast{transition-duration:.01ms}
  }

  /* ---- 手機直拿的話提醒轉橫，但不擋住遊戲：點一下就關掉 ---- */
  #rotate{
    position:fixed;inset:0;z-index:20;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px;
    font-size:16px;line-height:1.8;background:rgba(18,28,16,.94);cursor:pointer;
  }
  @media (orientation:portrait) and (max-width:820px){
    #rotate:not(.off){display:flex}
  }
</style>
</head>
<body>

<div id="rotate">
  <div style="font-size:44px">📱↻</div>
  <div>請把裝置轉成橫的<br><span style="color:#a8b89a;font-size:13px">守塔的路是橫著走的，橫拿看得比較清楚</span></div>
  <div style="color:#a8b89a;font-size:13px">（點一下這裡可以直接開始）</div>
</div>

<div id="app">

  <div id="hud" class="panel">
    <span class="stat" id="hp">❤️ 20</span>
    <span class="stat" id="coin">🪙 120</span>
    <span class="stat" id="wave">第 1 波</span>
    <div id="quiz">
      <span id="qemoji">🛡️</span>
      <span id="qzh">準備防守</span>
      <span id="qhint">蓋好塔再開戰</span>
    </div>
    <button id="say" disabled>🔊</button>
  </div>

  <div id="stage">
    <canvas id="cv" width="1088" height="576"></canvas>
    <div id="toast"></div>

    <div id="tray" class="panel">
      <button class="card sel" data-kind="archery">
        <b>🏹 箭塔 <i>40</i></b>
        <span>射程內的怪會被它射中</span>
      </button>
      <button class="card" data-kind="barracks">
        <b>🛡️ 軍營 <i>30</i></b>
        <span>派士兵擋路，替你爭取時間</span>
      </button>
      <button class="btn" id="go">開始第 1 波</button>
    </div>

    <div id="over">
      <h2 id="overTitle">守住了</h2>
      <p id="overText"></p>
      <button class="btn" id="overBtn">再玩一次</button>
    </div>
  </div>

</div>

<script src="../../data/core300.js"></script>
<script src="./art.js"></script>
<script>
(function(){
  "use strict";

  var WORDS = (window.CORE300 && window.CORE300.words) || [];
  var ART = window.TD_ART || {};
  if (!WORDS.length) { document.getElementById('qzh').textContent = '題庫載入失敗'; return; }

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var $ = function(id){ return document.getElementById(id); };

  var img = {};
  Object.keys(ART).forEach(function(k){ var i = new Image(); i.src = ART[k]; img[k] = i; });

  // ================= 地圖 =================
  // 一格 64 像素，15×9 格。上下最外圈是海，中間是一座島。
  // 島的中央有兩塊高地（石壁），把島分成上下兩條通道，怪就從左邊沿著通道走到城堡。
  var TILE = 64, COLS = 17, ROWS = 9;
  var LAND_R0 = 1, LAND_R1 = 7;
  var PLATS = [ {c0:2, c1:4, r0:4, r1:5}, {c0:7, c1:10, r0:4, r1:5} ];

  var TOP_Y = 230, BOT_Y = 424;
  var PATHS = [
    [{x:-40,y:TOP_Y},{x:818,y:TOP_Y},{x:908,y:258},{x:948,y:276}],
    [{x:-40,y:BOT_Y},{x:818,y:BOT_Y},{x:908,y:306},{x:948,y:280}]
  ];
  var CASTLE = {x:994, y:320};

  // 蓋塔的位置：y 是「腳下踩的地面」。高地上的四格兩條路都打得到，
  // 路邊的四格只顧得了自己那一條——這就是蓋塔要想一下的地方。
  var SLOTS = [
    {x:176, y:310, hi:true}, {x:288, y:310, hi:true},
    {x:496, y:310, hi:true}, {x:616, y:310, hi:true},
    {x:380, y:186}, {x:800, y:186},
    {x:380, y:500}, {x:800, y:500}
  ];

  var TOWERS = {
    archery:  { name:'箭塔', cost:40, range:170, damage:18 },
    barracks: { name:'軍營', cost:30, range:0, damage:0, blockRadius:30, soldierHp:60 }
  };
  var FOCUS_STEP = 0.2, FOCUS_MAX = 3;   // 三座以上一起打，傷害最多加到 1.6 倍

  var DECOR = [
    {k:'tree1', x:52,  y:150}, {k:'tree2', x:212, y:138},
    {k:'tree1', x:600, y:146}, {k:'tree2', x:700, y:168},
    {k:'tree1', x:1010,y:158}, {k:'tree2', x:896, y:140},
    {k:'tree1', x:128, y:508}, {k:'tree2', x:560, y:512},
    {k:'tree1', x:940, y:508}, {k:'tree2', x:700, y:498},
    {k:'rock1', x:312, y:176}, {k:'rock3', x:492, y:172},
    {k:'rock2', x:60,  y:478}, {k:'rock4', x:452, y:502},
    {k:'rock1', x:1040,y:470}, {k:'rock3', x:238, y:470},
    {k:'rock2', x:884, y:474}
  ];

  var PLATE_FONT = 'bold 17px system-ui, "Segoe UI", sans-serif';
  var PLATE_H = 28, TIER_GAP = 32, PRESS = .22;

  // ---------- 路徑工具 ----------
  function pathLength(pts){
    var L = 0;
    for (var i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    return L;
  }
  function pointAt(pts, dist){
    for (var i = 1; i < pts.length; i++) {
      var seg = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
      if (dist <= seg) {
        var t = seg ? dist/seg : 0;
        return { x: pts[i-1].x + (pts[i].x-pts[i-1].x)*t, y: pts[i-1].y + (pts[i].y-pts[i-1].y)*t };
      }
      dist -= seg;
    }
    return pts[pts.length-1];
  }
  var PATH_LEN = PATHS.map(pathLength);

  // ---------- 狀態 ----------
  var S;
  function reset(){
    S = {
      phase:'build', wave:1, hp:20, coins:120,
      towers:[], enemies:[], shots:[], pops:[], rings:[],
      target:null, combo:0, correct:0, asked:0,
      spawnQueue:[], spawnTimer:0,
      picked:'archery', over:false, t:0, hinted:false
    };
  }

  function shuffle(a){
    a = a.slice();
    for (var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  // ---------- 波次 ----------
  function waveSpec(n){
    return { count: 3 + n, hp: 20 + (n-1)*14, speed: 30 + (n-1)*3 };
  }

  function startWave(){
    if (S.phase !== 'build') return;
    var spec = waveSpec(S.wave);
    var lvl = S.wave <= 2 ? 1 : (S.wave <= 4 ? 2 : 3);
    var pool = shuffle(WORDS.filter(function(w){ return w.level <= lvl; }));

    S.spawnQueue = [];
    for (var i = 0; i < spec.count; i++) {
      S.spawnQueue.push({
        word: pool[i % pool.length], path: i % 2,
        hp: spec.hp, speed: spec.speed,
        art: i % 2 ? 'goblinPurple' : 'goblinRed'
      });
    }
    S.spawnTimer = 0;
    S.phase = 'battle';
    if (!S.hinted) { S.hinted = true; toast('點怪物、或牠腳下的字牌，都算點到'); }
    syncUI();
  }

  function spawnNext(){
    var e = S.spawnQueue.shift();
    if (!e) return;
    S.enemies.push({
      word:e.word, path:e.path, dist:0, hp:e.hp, maxHp:e.hp, speed:e.speed, art:e.art,
      frame:Math.random()*7, blocked:false,
      px:0, pw:0, tier:0, press:0, good:0, bad:0, shake:0,
      _x:-40, _y:e.path ? BOT_Y : TOP_Y
    });
    if (!S.target) pickQuestion();
  }

  // 題目一定從「場上還活著的怪」裡選，所以永遠有答案可以點
  function pickQuestion(){
    if (!S.enemies.length) { S.target = null; return syncQuiz(); }
    S.target = S.enemies[(Math.random()*S.enemies.length)|0];
    S.asked++;
    syncQuiz();
  }

  function speak(t){
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.85;
      speechSynthesis.speak(u);
    } catch(e){}
  }

  function toast(msg){
    var el = $('toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 1500);
  }

  function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }

  // ---------- 作答 ----------
  function tapEnemy(e){
    if (S.phase !== 'battle' || !S.target) return;
    e.press = PRESS;

    if (e === S.target) {
      S.correct++; S.combo++;
      e.good = .45;
      buzz(14);
      var gain = 5 + Math.min(5, Math.floor(S.combo/3) * 2);
      S.coins += gain;
      S.rings.push({ x:e._x, y:e._y-20, r:16, max:56, life:.42, color:'#ffe08a' });
      volley(e);
      S.pops.push({ x:e._x, y:e._y-56, text:'+'+gain+' 🪙', color:'#f2b229', life:1 });
      speak(e.word.word);
    } else {
      S.combo = 0;
      e.bad = .5; e.shake = .35;
      buzz(55);
      S.pops.push({ x:e._x, y:e._y-46, text:'✗', color:'#ffb4b0', life:.8 });
      pickQuestion();
    }
    syncUI();
  }

  // 齊射：射程涵蓋到這隻怪的塔全部打它一次，同時開火的塔越多傷害越高
  function volley(e){
    var hits = [], base = 0;
    S.towers.forEach(function(t){
      var spec = TOWERS[t.kind];
      if (!spec.damage) return;
      var s = SLOTS[t.slot], ox = s.x, oy = s.y - 20;
      if (Math.hypot(ox - e._x, oy - (e._y-22)) > spec.range) return;
      hits.push(t); base += spec.damage;
      S.shots.push({ x0:ox, y0:oy, x1:e._x, y1:e._y-24, life:.22 });
    });

    if (!hits.length) {
      S.pops.push({ x:e._x, y:e._y-40, text:'沒有塔打得到', color:'#ffd9a0', life:1.2 });
      pickQuestion();
      return;
    }

    var mult = 1 + FOCUS_STEP * Math.min(FOCUS_MAX, hits.length - 1);
    var total = Math.round(base * mult);
    e.hp -= total;
    S.pops.push({ x:e._x+18, y:e._y-40, text:'-'+total, color:'#fff', life:.9 });
    if (hits.length > 1)
      S.pops.push({ x:e._x+18, y:e._y-22, text:'集火 ×'+mult.toFixed(1), color:'#ffd05a', life:1 });
    if (e.hp <= 0) killEnemy(e);
    pickQuestion();
  }

  function killEnemy(e){
    var i = S.enemies.indexOf(e);
    if (i >= 0) S.enemies.splice(i, 1);
    if (S.target === e) S.target = null;
  }

  // ---------- 蓋塔 ----------
  function tapSlot(idx){
    if (S.phase !== 'build') return;
    if (S.towers.some(function(t){ return t.slot === idx; })) return toast('這格已經有建築了');
    var kind = S.picked, spec = TOWERS[kind];
    if (S.coins < spec.cost) return toast('銅幣不夠，還差 ' + (spec.cost - S.coins) + ' 枚');
    S.coins -= spec.cost;
    var t = { slot:idx, kind:kind, soldier:null };
    if (kind === 'barracks') t.soldier = makeSoldier(idx);
    S.towers.push(t);
    syncUI();
  }

  // 軍營的士兵站到最近的路徑點上擋路
  function makeSoldier(slotIdx){
    var s = SLOTS[slotIdx], best = null;
    PATHS.forEach(function(pts, pi){
      for (var d = 0; d < PATH_LEN[pi]; d += 6) {
        var p = pointAt(pts, d), dd = Math.hypot(p.x-s.x, p.y-s.y);
        if (!best || dd < best.d) best = { d:dd, x:p.x, y:p.y, path:pi, dist:d };
      }
    });
    return { x:best.x, y:best.y, path:best.path, dist:best.dist, hp:TOWERS.barracks.soldierHp, respawn:0 };
  }

  // ---------- 每幀更新 ----------
  function update(dt){
    S.t += dt;

    if (S.phase === 'battle') {
      S.spawnTimer -= dt;
      if (S.spawnQueue.length && S.spawnTimer <= 0) { spawnNext(); S.spawnTimer = 3.0; }

      var soldiers = S.towers.filter(function(t){ return t.soldier && t.soldier.hp > 0; })
                             .map(function(t){ return t.soldier; });

      S.enemies.slice().forEach(function(e){
        e.frame = (e.frame + dt*7) % 7;
        ['press','good','bad','shake'].forEach(function(k){ if (e[k] > 0) e[k] -= dt; });

        var blocker = null;
        soldiers.forEach(function(sd){
          if (sd.path !== e.path) return;
          var gap = sd.dist - e.dist;
          if (gap >= -4 && gap < TOWERS.barracks.blockRadius) blocker = sd;
        });
        e.blocked = !!blocker;

        if (blocker) blocker.hp -= dt * 9;
        else e.dist += e.speed * dt;

        var p = pointAt(PATHS[e.path], e.dist);
        e._x = p.x; e._y = p.y;

        if (e.dist >= PATH_LEN[e.path]) {
          S.hp--;
          S.pops.push({ x:CASTLE.x-40, y:CASTLE.y-70, text:'-1 ❤️', color:'#ff9a94', life:1.1 });
          killEnemy(e);
          syncUI();
        }
      });

      S.towers.forEach(function(t){
        if (t.kind !== 'barracks' || !t.soldier) return;
        if (t.soldier.hp <= 0) {
          t.soldier.respawn += dt;
          if (t.soldier.respawn > 6) t.soldier = makeSoldier(t.slot);
        }
      });

      if (!S.target && S.enemies.length) pickQuestion();

      if (S.hp <= 0) return finish(false);
      if (!S.spawnQueue.length && !S.enemies.length) {
        if (S.wave >= 5) return finish(true);
        S.wave++; S.phase = 'build'; S.target = null; syncUI(); syncQuiz();
      }
    }

    S.shots = S.shots.filter(function(s){ s.life -= dt; return s.life > 0; });
    S.pops  = S.pops.filter(function(p){ p.life -= dt; p.y -= dt*22; return p.life > 0; });
    S.rings = S.rings.filter(function(r){ r.life -= dt; return r.life > 0; });
  }

  // ================= 字牌排版 =================
  // 牌子黏在怪腳下，但同一條路上擠在一起的時候會先左右推開；
  // 推不開才往下錯開一層，最多三層。
  function layoutPlates(){
    ctx.font = PLATE_FONT;
    S.enemies.forEach(function(e){
      e.pw = Math.max(58, ctx.measureText(e.word.word).width + 24);
      e.px = e._x; e.tier = 0;
    });

    [0,1].forEach(function(lane){
      var list = S.enemies.filter(function(e){ return e.path === lane; })
                          .sort(function(a,b){ return a._x - b._x; });
      for (var pass = 0; pass < 6; pass++) {
        for (var i = 1; i < list.length; i++) {
          var a = list[i-1], b = list[i];
          var need = (a.pw + b.pw)/2 + 6, gap = b.px - a.px;
          if (gap < need) { var push = (need - gap)/2; a.px -= push; b.px += push; }
        }
        list.forEach(function(e){
          e.px = Math.max(e._x - 46, Math.min(e._x + 46, e.px));       // 不能離本體太遠
          e.px = Math.max(e.pw/2 + 3, Math.min(W - e.pw/2 - 3, e.px)); // 也不能超出畫布
        });
      }
      for (var j = 1; j < list.length; j++) {
        var p = list[j-1], q = list[j];
        if (q.px - p.px < (p.pw + q.pw)/2) q.tier = (p.tier + 1) % 3;
      }
    });
  }
  function plateY(e){ return e._y + 4 + e.tier * TIER_GAP; }

  // ================= 畫面 =================
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function tile(sc, sr, dx, dy){
    if (img.tiles.complete) ctx.drawImage(img.tiles, sc*64, sr*64, 64, 64, dx, dy, 64, 64);
  }

  // 地形只有開場會變，畫一次存起來就好
  var terrain = null;
  function buildTerrain(){
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var save = ctx; ctx = c.getContext('2d');

    if (img.water.complete) {
      var pat = ctx.createPattern(img.water, 'repeat');
      ctx.fillStyle = pat; ctx.fillRect(0,0,W,H);
    } else { ctx.fillStyle = '#2a5b8f'; ctx.fillRect(0,0,W,H); }

    // 圖塊是 4×4 的接邊組：欄 0/1/2/3 是左/中/右/單，列 0/1/2/3 是上/中/下/單。
    // 島的左右兩側刻意都用「中」，讓陸地跑出畫面外，怪才有地方走進來。
    for (var r = LAND_R0; r <= LAND_R1; r++) {
      var sr = (r === LAND_R0) ? 0 : (r === LAND_R1 ? 2 : 1);
      for (var c2 = 0; c2 < COLS; c2++) tile(1, sr, c2*TILE, r*TILE);
    }

    // 高地用第二組（欄 5~8）：上排是「單」列，草的下緣就是石壁的起點；
    // 下排接第 5 列的石壁底，底下那條白邊就是崖腳。
    PLATS.forEach(function(p){
      for (var r = p.r0; r <= p.r1; r++) {
        var sr = (r === p.r0) ? 3 : 5;
        for (var c3 = p.c0; c3 <= p.c1; c3++) {
          var sc = (p.c0 === p.c1) ? 8 : (c3 === p.c0 ? 5 : (c3 === p.c1 ? 7 : 6));
          tile(sc, sr, c3*TILE, r*TILE);
        }
      }
    });

    // 這套圖塊沒有土路磚，所以路用「被踩禿的草」表現：兩層半透明土色壓在草地上
    PATHS.forEach(function(pts){
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      [[54,'rgba(122,100,54,.45)'], [40,'rgba(198,170,112,.55)'], [26,'rgba(216,192,138,.45)']].forEach(function(st){
        ctx.lineWidth = st[0]; ctx.strokeStyle = st[1];
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
        for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
      });
    });

    ctx = save;
    terrain = c;
  }

  function shadow(x, y, rx){
    ctx.fillStyle = 'rgba(20,40,20,.22)';
    ctx.beginPath(); ctx.ellipse(x, y, rx, rx*0.38, 0, 0, 7); ctx.fill();
  }

  function draw(){
    if (!terrain && img.tiles.complete && img.water.complete) buildTerrain();
    if (terrain) ctx.drawImage(terrain, 0, 0);
    else { ctx.fillStyle = '#6ea84f'; ctx.fillRect(0,0,W,H); }

    // 備戰時把空地和射程畫出來，才看得懂擺哪裡有用
    if (S.phase === 'build') {
      SLOTS.forEach(function(s, i){
        if (S.towers.some(function(t){ return t.slot === i; })) return;
        var spec = TOWERS[S.picked];
        if (spec.range) {
          ctx.save();
          ctx.setLineDash([6,8]); ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(s.x, s.y-20, spec.range, 0, 7); ctx.stroke();
          ctx.restore();
        }
        ctx.fillStyle = 'rgba(255,255,255,.26)';
        ctx.beginPath(); ctx.arc(s.x, s.y-12, 20, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.font = 'bold 26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('+', s.x, s.y-11);
      });
      S.towers.forEach(function(t){
        var spec = TOWERS[t.kind];
        if (!spec.range) return;
        var s = SLOTS[t.slot];
        ctx.strokeStyle = 'rgba(255,224,138,.4)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(s.x, s.y-20, spec.range, 0, 7); ctx.stroke();
        ctx.fillStyle = 'rgba(255,224,138,.05)'; ctx.fill();
      });
    }

    // 所有站在地上的東西照「腳下的 y」由遠到近排，遮擋關係才會對
    var scene = [];
    DECOR.forEach(function(d){ scene.push({ y:d.y, f:function(){ drawDecor(d); } }); });
    scene.push({ y:CASTLE.y, f:drawCastle });
    S.towers.forEach(function(t){ var s = SLOTS[t.slot]; scene.push({ y:s.y, f:function(){ drawTower(t, s); } }); });
    S.towers.forEach(function(t){
      var sd = t.soldier;
      if (sd && sd.hp > 0) scene.push({ y:sd.y, f:function(){ drawSoldier(sd); } });
    });
    S.enemies.forEach(function(e){ scene.push({ y:e._y, f:function(){ drawEnemy(e); } }); });
    scene.sort(function(a,b){ return a.y - b.y; });
    scene.forEach(function(o){ o.f(); });

    // 字牌一律畫在最上層，永遠不會被塔或樹蓋住
    layoutPlates();
    S.enemies.slice().sort(function(a,b){ return a.tier - b.tier; }).forEach(drawPlate);

    S.shots.forEach(function(s){
      ctx.strokeStyle = 'rgba(255,240,190,' + (s.life/0.22) + ')';
      ctx.lineWidth = 3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(s.x0,s.y0); ctx.lineTo(s.x1,s.y1); ctx.stroke();
    });

    S.rings.forEach(function(r){
      var t = 1 - r.life/0.42;
      ctx.strokeStyle = r.color; ctx.globalAlpha = (1-t) * .9; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r + (r.max-r.r)*t, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    });

    S.pops.forEach(function(p){
      ctx.globalAlpha = Math.min(1, p.life);
      ctx.font = 'bold 17px system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,.6)';
      ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    });
  }

  function drawDecor(d){
    var im = img[d.k];
    if (!im || !im.complete) return;
    shadow(d.x, d.y - 3, im.width * .3);
    ctx.drawImage(im, d.x - im.width/2, d.y - im.height, im.width, im.height);
  }

  function drawCastle(){
    var im = img.castle;
    if (!im || !im.complete) return;
    shadow(CASTLE.x, CASTLE.y - 6, 62);
    ctx.drawImage(im, CASTLE.x - 75, CASTLE.y - 120, 150, 120);
  }

  function drawTower(t, s){
    var im = img[t.kind];
    if (!im || !im.complete) return;
    shadow(s.x, s.y - 4, 34);
    ctx.drawImage(im, s.x - 39, s.y - 102, 78, 104);
  }

  function drawSoldier(sd){
    if (img.warrior && img.warrior.complete) {
      shadow(sd.x, sd.y + 2, 20);
      ctx.drawImage(img.warrior, sd.x-42, sd.y-63, 84, 84);
    }
    bar(sd.x-19, sd.y-48, 38, 5, sd.hp/TOWERS.barracks.soldierHp, '#6fbf4a');
  }

  function drawEnemy(e){
    var im = img[e.art];
    var sc = 1 + (e.press > 0 ? Math.sin(e.press/PRESS * Math.PI) * .18 : 0);
    var sh = e.shake > 0 ? Math.sin(e.shake*70) * 4 : 0;

    shadow(e._x + sh, e._y + 1, 21);
    ctx.save();
    ctx.translate(e._x + sh, e._y); ctx.scale(sc, sc); ctx.translate(-(e._x + sh), -e._y);
    if (im && im.complete)
      ctx.drawImage(im, ((e.frame|0)%7)*64, 0, 64, 64, e._x + sh - 42, e._y - 62, 84, 84);
    if (e.bad > 0) {
      ctx.globalAlpha = Math.min(.55, e.bad);
      ctx.fillStyle = '#d43c32';
      ctx.beginPath(); ctx.ellipse(e._x+sh, e._y-20, 26, 28, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    bar(e._x + sh - 22, e._y - 46, 44, 5, e.hp/e.maxHp, '#d4504a');
    if (e.blocked) {
      ctx.font = '15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.fillText('⚔️', e._x + 30, e._y - 30);
    }
  }

  // 牌子＝怪的底座。整塊跟著怪走、整塊都可以點。
  function drawPlate(e){
    var py = plateY(e), w = e.pw;
    var sh = e.shake > 0 ? Math.sin(e.shake*70) * 4 : 0;
    var cx = e.px + sh, x = cx - w/2;

    // 被推開或錯層時，拉一條線回到怪身上，才看得出牌子是誰的
    if (Math.abs(e.px - e._x) > 5 || e.tier > 0) {
      ctx.strokeStyle = 'rgba(24,18,10,.5)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(e._x + sh, e._y - 4); ctx.lineTo(cx, py + 6); ctx.stroke();
    }

    var sc = 1 + (e.press > 0 ? Math.sin(e.press/PRESS * Math.PI) * .16 : 0);
    ctx.save();
    ctx.translate(cx, py + PLATE_H/2); ctx.scale(sc, sc); ctx.translate(-cx, -(py + PLATE_H/2));

    ctx.fillStyle = 'rgba(0,0,0,.28)';
    roundRect(x, py + 3, w, PLATE_H, 9); ctx.fill();
    ctx.fillStyle = e.good > 0 ? '#3f7a34' : (e.bad > 0 ? '#8c3730' : '#2f2519');
    roundRect(x, py, w, PLATE_H, 9); ctx.fill();
    ctx.strokeStyle = e.good > 0 ? '#a8e07a' : (e.bad > 0 ? '#ff9a94' : '#8a6b45');
    ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x+8, py+4); ctx.lineTo(x+w-8, py+4); ctx.stroke();

    ctx.fillStyle = '#fff'; ctx.font = PLATE_FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(e.word.word, cx, py + PLATE_H/2 + 1);
    ctx.restore();
  }

  function bar(x,y,w,h,pct,color){
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x-1,y-1,w+2,h+2);
    ctx.fillStyle = color; ctx.fillRect(x, y, Math.max(0, w*pct), h);
  }

  // ---------- UI ----------
  function syncUI(){
    $('hp').textContent = '❤️ ' + Math.max(0, S.hp);
    $('coin').textContent = '🪙 ' + S.coins;
    $('wave').textContent = '第 ' + S.wave + ' 波';
    var build = (S.phase === 'build');
    $('tray').hidden = !build;
    $('go').textContent = '開始第 ' + S.wave + ' 波';
    $('say').disabled = !S.target;
  }

  function syncQuiz(){
    if (S.target) {
      $('qemoji').textContent = S.target.word.emoji;
      $('qzh').textContent = S.target.word.zh;
      $('qhint').textContent = '（' + S.target.word.pos + '）點出寫著這個字的怪';
    } else if (S.phase === 'build') {
      $('qemoji').textContent = '🛡️';
      $('qzh').textContent = '準備防守';
      $('qhint').textContent = '點空地蓋塔，好了就開戰';
    }
    $('say').disabled = !S.target;
  }

  function finish(win){
    S.phase = 'done'; S.over = true;
    $('tray').hidden = true;
    $('overTitle').textContent = win ? '🎉 守住了！' : '城堡被攻破了';
    var acc = S.asked ? Math.round(S.correct / S.asked * 100) : 0;
    $('overText').textContent = win
      ? '五波全部擋下來了。答對 ' + S.correct + ' 題，正確率 ' + acc + '%。'
      : '撐到第 ' + S.wave + ' 波。答對 ' + S.correct + ' 題，正確率 ' + acc + '%。塔集中一點，或用軍營把怪擋久一些。';
    $('over').classList.add('on');
  }

  // ---------- 輸入 ----------
  // 怪本體和牠的字牌都算同一個目標；都沒點到的話，附近最近的那隻也算，
  // 手指比較粗也不會一直落空。
  function pickHit(x, y){
    var exact = null, near = null, nd = 46;
    S.enemies.forEach(function(e){
      var py = plateY(e);
      var inPlate = x >= e.px - e.pw/2 - 4 && x <= e.px + e.pw/2 + 4 && y >= py - 4 && y <= py + PLATE_H + 4;
      var inBody  = x >= e._x - 30 && x <= e._x + 30 && y >= e._y - 48 && y <= e._y + 6;
      if (inPlate || inBody) { exact = e; return; }
      var d = Math.min(Math.hypot(e._x - x, e._y - 22 - y), Math.hypot(e.px - x, py + PLATE_H/2 - y));
      if (d < nd) { nd = d; near = e; }
    });
    return exact || near;
  }

  cv.addEventListener('pointerdown', function(ev){
    if (S.over) return;
    var r = cv.getBoundingClientRect();
    var x = (ev.clientX - r.left) * W / r.width;
    var y = (ev.clientY - r.top)  * H / r.height;

    if (S.phase === 'battle') {
      var hit = pickHit(x, y);
      if (hit) tapEnemy(hit);
      else S.rings.push({ x:x, y:y, r:6, max:30, life:.3, color:'rgba(255,255,255,.7)' });
      return;
    }
    if (S.phase === 'build') {
      for (var i = 0; i < SLOTS.length; i++)
        if (Math.hypot(SLOTS[i].x - x, SLOTS[i].y - 16 - y) < 42) return tapSlot(i);
    }
  });

  document.querySelectorAll('.card').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.card').forEach(function(b){ b.classList.remove('sel'); });
      btn.classList.add('sel');
      S.picked = btn.dataset.kind;
    });
  });

  $('rotate').addEventListener('click', function(){ this.classList.add('off'); });

  $('go').addEventListener('click', function(){
    if (!S.towers.length) return toast('先蓋一座塔再開戰');
    startWave();
  });
  $('say').addEventListener('click', function(){ if (S.target) speak(S.target.word.word); });
  $('overBtn').addEventListener('click', function(){
    $('over').classList.remove('on'); reset(); syncUI(); syncQuiz();
  });

  // ---------- 主迴圈 ----------
  var last = performance.now();
  function loop(now){
    var dt = Math.min(.05, (now - last)/1000); last = now;
    if (!S.over) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  reset(); syncUI(); syncQuiz();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
